<!DOCTYPE html>

<head>

<style>
:root{--navy:#0B1628;--gold:#C9A84C;--gold-light:#F0D98A;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:linear-gradient(165deg,#0B1628 0%,#12233F 55%,#0B1628 100%);
color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;line-height:1.8;}
.box{max-width:600px;text-align:center;}
.code{font-family:'Noto Serif KR',serif;font-size:clamp(64px,14vw,110px);font-weight:700;color:var(--gold);
line-height:1;letter-spacing:-2px;margin-bottom:8px;}
h1{font-family:'Noto Serif KR',serif;font-size:clamp(22px,4vw,30px);font-weight:700;margin-bottom:16px;letter-spacing:-.4px;}
.lede{color:rgba(255,255,255,.72);font-size:16px;margin-bottom:38px;}
.links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:44px;}
.btn{display:inline-block;padding:13px 26px;border-radius:9px;text-decoration:none;font-weight:700;font-size:15px;}
.gold{background:var(--gold);color:var(--navy);}
.gold:hover{background:var(--gold-light);}
.ghost{border:1px solid rgba(255,255,255,.3);color:#fff;}
.ghost:hover{background:rgba(255,255,255,.08);}
.hr{border-top:1px solid rgba(201,168,76,.22);padding-top:28px;}
.hr-t{font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:700;margin-bottom:16px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;}
.grid a{color:rgba(255,255,255,.75);text-decoration:none;font-size:14px;padding:9px 12px;
border:1px solid rgba(255,255,255,.12);border-radius:8px;transition:all .2s;}
.grid a:hover{border-color:var(--gold);color:var(--gold-light);}
.foot{margin-top:36px;font-size:13px;color:rgba(255,255,255,.4);}
.foot a{color:var(--gold);text-decoration:none;}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>

    <a href="/#contact" class="btn ghost">무료 상담 신청</a>
  </div>

  <div class="hr">
    <div class="hr-t">업종별 안내</div>
    <div class="grid">
      <a href="/seattle-korean-church-website">교회 · 선교단체</a>

    </div>
  </div>

  <p class="foot">
    찾으시는 것이 없으면 <a href="mailto:hello@nanuriweb.com">hello@nanuriweb.com</a> 으로 알려주세요.<br>
    Hebron Platform LLC · Seattle, WA
  </p>
</div>
</body>
</html>
